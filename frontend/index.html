<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Командный проект | Fullstack Team</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка с вкладками -->
    <header>
        <nav></nav>
    </header>

    <!-- Основной контент (карточки, команда и таски) -->
    <main id="tabContent">
        <!-- Шаблоны вкладок для Task 1 и Task 2 -->
        
        <!-- Вкладка Task 1 -->
        <section id="tab-task1">
            <h1>Task 1. Работа с DOM</h1>
            <div class="card">
                <p class="label">Управление элементом "Привет, мир!"</p>
                <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                    <button id="btn-create" class="tab-btn active">Создать / Восстановить</button>
                    <button id="btn-change" class="tab-btn">Изменить текст</button>
                    <button id="btn-delete" class="tab-btn">Удалить элемент</button>
                </div>
                <div id="hello-container" style="padding: 10px; border: 1px dashed #555; border-radius: 6px; min-height: 40px;">
                    <!-- Сюда динамически добавляется элемент -->
                </div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <p class="label">Изменяемый абзац (кликни для смены цвета)</p>
                <p id="toggle-paragraph" style="cursor: pointer; user-select: none; padding: 10px; border: 1px solid #444; border-radius: 6px;">
                    Это изменяемый абзац. Кликни на меня!
                </p>
            </div>
        </section>

        <!-- Вкладка Task 2 -->
        <section id="tab-task2">
            <h1>Task 2. Управление классами</h1>
            <div class="card">
                <p class="label">Интерактивная карточка</p>
                <div id="demo-card" class="card" style="cursor: pointer; padding: 20px; border: 1px solid #555; border-radius: 8px;">
                    <p style="margin: 0;">Нажми на меня, чтобы переключить класс <code>active</code></p>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script src="tasks.js"></script>
</body>
</html>
