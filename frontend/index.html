<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Командный проект | Fullstack Team</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка и навигационные вкладки -->
    <header>
        <nav></nav>
    </header>

    <!-- Основной контент (карточки участников и вкладка команды) -->
    <main id="tabContent"></main>

    <!-- Интерактивный блок для выполнения Task 1 и Task 2 (DOM-манипуляции) -->
    <div id="tasks-container" style="max-width: 900px; margin: 40px auto; padding: 20px; border-top: 1px solid #333;">
        <h2 style="margin-bottom: 15px;">Практика DOM (Tasks)</h2>
        
        <!-- Элементы для Task 1 -->
        <div id="my-element" style="margin-bottom: 10px; font-weight: bold;">Старый текст элемента</div>
        <div class="old-element" style="color: #ff6b6b; margin-bottom: 10px;">Этот элемент будет удален скриптом</div>

        <!-- Демо-карточка для Task 2 -->
        <div id="demo-card" class="card" style="margin-top: 15px; cursor: pointer; padding: 15px; border: 1px solid #444; border-radius: 8px;">
            <p style="margin: 0;">Нажми на меня, чтобы переключить класс active (Task 2)</p>
        </div>
    </div>

    <!-- Основная логика работы с API и переключением вкладок -->
    <script src="app.js"></script>
    
    <!-- Скрипт с учебными задачами по DOM -->
    <script src="tasks.js"></script>

</body>
</html>
